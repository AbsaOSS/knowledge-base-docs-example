site_name: Knowledge Base User Guide
site_description: User guide for the Knowledge Base — publish docs, run a knowledge base, embed it and connect AI tools. Built with the docs template it documents.
docs_dir: docs
site_dir: dist/docs

theme:
  name: null
  custom_dir: theme

# nav is auto-generated from frontmatter (title, order, section) by pack.py

plugins:
  - search
  - macros:        # reusable components for docs pages — see main.py
      module_name: main
