# Decap CMS configuration.
# Docs: https://decapcms.org/docs/
#
# To use: update backend.repo to your GitHub org/repo, then visit /admin/ on
# the deployed site. Authenticate with GitHub and start editing.

# Logo shown on the login screen. Relative path resolves against /admin/, so it
# is base-path-safe on a GitHub project page. File lives at admin/logo.svg.
logo_url: logo.svg

backend:
  name: github
  repo: AbsaOSS/knowledge-base-docs-example
  branch: master
  # OAuth handled by a Cloudflare Worker (sveltia-cms-auth). base_url overrides
  # Decap's default Netlify OAuth host; auth_endpoint matches the Worker's /auth
  # route. The Worker holds the GitHub OAuth client secret.
  base_url: https://sveltia-cms-auth.kb-cms.workers.dev
  auth_endpoint: auth

# local_backend: true  # uncomment for local dev (run: npx decap-server)

# media_folder = where uploads are committed in the repo.
# public_folder = the path written into Markdown. Keep it RELATIVE (no leading
# slash) so images resolve regardless of where the site is served — e.g. a
# GitHub *project* page under /<repo>/ where an absolute "/docs/..." would 404.
# MkDocs rewrites this relative path correctly for each page's output URL.
media_folder: docs/assets/images
public_folder: assets/images

# ── Documentation pages ──────────────────────────────────────────────────────
# Folder collection: editors can create, edit, and delete pages in docs/.
# Navigation order is auto-generated from frontmatter at build time.

collections:
  - name: docs
    label: Documentation
    folder: docs
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Nav Order, widget: number, value_type: int, min: 1 }
      - { name: section, label: Nav Section, widget: string, required: false,
          hint: "Leave empty for top-level nav. Set a name to group under a sidebar section." }
      - { name: body, label: Content, widget: markdown }

  # ── Showcase landing page ────────────────────────────────────────────────────
  # Raw HTML editing with live preview in the CMS.
  # Content is wrapped in a full HTML page by pack.py at build time.

  - name: showcase
    label: Showcase Page
    files:
      - name: showcase
        label: Showcase HTML
        file: data/showcase.yml
        fields:
          - name: content
            label: HTML Content
            widget: code
            default_language: html
            allow_language_selection: false
            output_code_only: true

  # ── Knowledge base metadata ──────────────────────────────────────────────────
  # kb-docs.json is the manifest the knowledge base reads (contract v1). This
  # template publishes one app, so `apps` holds a single entry.

  - name: settings
    label: Settings
    files:
      - name: kb-docs
        label: Knowledge Base Metadata
        file: kb-docs.json
        fields:
          - { name: kbVersion, label: Contract Version, widget: hidden, default: "1" }
          - name: apps
            label: Apps
            widget: list
            min: 1
            max: 1
            fields:
              - { name: slug, label: Slug, widget: string,
                  hint: "Lowercase letters, numbers, hyphens. Becomes the URL path. Must be unique across the whole knowledge base." }
              - { name: name, label: Display Name, widget: string }
              - { name: description, label: Description, widget: text,
                  hint: "One sentence, 10–280 characters, shown on the catalog card." }
              - { name: icon, label: Icon, widget: select, default: book-open,
                  options: [book-open, cube, chip, chart-bar, shield, cog, terminal, globe,
                            layers, lightning-bolt, document, collection, puzzle, database] }
              - { name: tags, label: Tags, widget: list, max: 5, required: false,
                  field: { name: tag, widget: string } }
              - { name: entryPoint, label: Entry Point, widget: hidden, default: "index.html" }
              - name: pages
                label: Pages (generated)
                widget: list
                required: false
                collapsed: true
                hint: "Written by the build from each page's frontmatter (title, order, section). Do not edit by hand."
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: path, label: Path, widget: string }
                  - { name: order, label: Order, widget: number, value_type: int }
                  - { name: section, label: Section, widget: string, required: false }
