# Showcase landing page — raw HTML content.
# Edit via CMS at /admin/ (live preview) or by hand.
# Rendered into dist/index.html by pack.py at build time.

content: |
  <div id="showcase-root">

    <!-- ── Navigation ── -->
    <nav class="sc-nav" aria-label="Site navigation">
      <a href="index.html" class="sc-nav__logo" aria-label="Go to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="height:28px;width:28px;" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span class="sc-nav__title">Knowledge Base</span>
      </a>
      <div class="sc-nav__links">
        <a href="docs/" class="sc-nav__link">Overview</a>
        <a href="docs/kb/onboarding/" class="sc-nav__link">Publish Your Docs</a>
        <a href="docs/kb/registry/" class="sc-nav__link">Run a Knowledge Base</a>
        <a href="docs/kb/embedding/" class="sc-nav__link">Embed</a>
        <a href="docs/" class="sc-nav__cta">Read the Guide</a>
      </div>
    </nav>
    <!-- ── /Navigation ── -->

    <!-- ── Hero ── -->
    <section class="sc-hero" aria-label="Hero">
      <div class="sc-hero__bg" role="presentation"></div>
      <div class="sc-hero__content">
        <span class="sc-hero__eyebrow">User Guide</span>
        <h1 class="sc-hero__title">
          One portal for all<br>
          <span>your documentation</span>
        </h1>
        <p class="sc-hero__sub">The Knowledge Base collects documentation from every team's repository into a single branded portal. Publish from a Markdown file or a full docs site, run the portal yourself, or embed it in your app.</p>
        <div class="sc-hero__actions">
          <a href="docs/kb/onboarding/" class="sc-btn sc-btn--primary">Publish your docs</a>
          <a href="docs/" class="sc-btn sc-btn--outline">Read the Guide</a>
        </div>
      </div>
    </section>

    <!-- ── Features ── -->
    <section aria-label="What is included">
      <div class="sc-section">
        <p class="sc-section__label">What it does</p>
        <h2 class="sc-section__title">Publish, run and embed</h2>
        <p class="sc-section__sub">Teams keep their docs in their own repositories. The Knowledge Base aggregates them at build time into one static site.</p>

        <div class="sc-features">
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <h3 class="sc-feature-card__title">Three ways to publish</h3>
            <p class="sc-feature-card__text">Single-page docs from Markdown with one workflow file, a packaged static site, or an iframe stopgap for docs hosted elsewhere.</p>
          </div>
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <h3 class="sc-feature-card__title">A checked contract</h3>
            <p class="sc-feature-card__text">Every requirement has a rule ID. Run the checker locally, on pull requests with <code>check-docs</code>, and on every release.</p>
          </div>
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </div>
            <h3 class="sc-feature-card__title">Run your own</h3>
            <p class="sc-feature-card__text">A reusable build workflow, a hardened nginx image and a deployment-repo pattern, including private networks and mirrors.</p>
          </div>
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h3 class="sc-feature-card__title">Embed anywhere</h3>
            <p class="sc-feature-card__text">Serve the portal as a web fragment inside a host app, with no page reloads and no third-party requests.</p>
          </div>
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            </div>
            <h3 class="sc-feature-card__title">Release-driven</h3>
            <p class="sc-feature-card__text">Publish a GitHub Release and the action attaches <code>kb-docs.tar.gz</code>. The portal picks it up on its next build.</p>
          </div>
          <div class="sc-feature-card">
            <div class="sc-feature-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <h3 class="sc-feature-card__title">Docs Template</h3>
            <p class="sc-feature-card__text">This guide is built with the MkDocs Docs Template: clone it, write Markdown, tag a release.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Steps ── -->
    <div class="sc-steps-bg">
      <section aria-label="How it works">
        <div class="sc-section">
          <p class="sc-section__label">How it works</p>
          <h2 class="sc-section__title">From repo to portal in three steps</h2>
          <p class="sc-section__sub">The same path works for a Markdown file or a full docs site.</p>

          <div class="sc-steps">
            <div class="sc-step">
              <div class="sc-step__num">1</div>
              <div>
                <p class="sc-step__title">Pick a type</p>
                <p class="sc-step__text">Add one workflow for single-page docs, or make your site's build headless and describe it in <code>kb-docs.json</code>.</p>
              </div>
            </div>
            <div class="sc-step">
              <div class="sc-step__num">2</div>
              <div>
                <p class="sc-step__title">Publish a release</p>
                <p class="sc-step__text">The publish action validates your docs against the contract rules and attaches <code>kb-docs.tar.gz</code> to the release.</p>
              </div>
            </div>
            <div class="sc-step">
              <div class="sc-step__num">3</div>
              <div>
                <p class="sc-step__title">Register</p>
                <p class="sc-step__text">Open a PR adding <code>{ "repo": "owner/name" }</code> to the deployment's registry. Everything else is read from your manifest.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ── CTA banner ── -->
    <section class="sc-cta" aria-label="Call to action">
      <h2 class="sc-cta__title">Ready to publish your documentation?</h2>
      <p class="sc-cta__sub">Start with the onboarding guide, or read how to run and embed the Knowledge Base.</p>
      <div class="sc-cta__actions">
        <a href="docs/kb/onboarding/" class="sc-btn sc-btn--light">Get Started</a>
        <a href="docs/" class="sc-btn sc-btn--ghost">Full User Guide</a>
      </div>
    </section>

    <!-- ── Footer ── -->
    <footer class="sc-footer">
      <span>Knowledge Base User Guide &mdash; built with the Docs Template</span>
      <span>
        <a href="docs/">Docs</a>
        &ensp;&middot;&ensp;
        <a href="docs/kb/how-it-works/">How it works</a>
      </span>
    </footer>

  </div><!-- /#showcase-root -->
